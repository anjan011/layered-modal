    <body>

        <div class="container mt-3 mb-3">
            <div class="row">
                <div class="col">
                    <h2 class="mb-3">Load and Transform Content Via JSON</h2>

                    <div class="mb-3">
                        In this example we will load a sample JSON dataset from <kbd>https://jsonplaceholder.typicode.com/users</kbd> as a table inside a modal and display additional info as stacked modals.
                    </div>

                    <div class="mb-3">
                        <button id="modal-trigger" type="button" class="btn btn-success">Click to Load DATA</button>
                    </div>

                    <div id="button-container">

                    </div>

                </div>
            </div>
        </div>

        <script type="module">
            //import {ModalManager} from "https://cdn.jsdelivr.net/npm/layered-modal@latest/dist/bundle.min.esm.js";
            import {ModalManager, ModalParam2DataAttrs} from "/dist/bundle.dev.min.esm.js";



            window.ModalManager = ModalManager;
            window.ModalParam2DataAttrs = ModalParam2DataAttrs;
        </script>

        <script src="transformer.js"></script>

        <script>
            document.addEventListener('DOMContentLoaded', function () {

                let btn = document.getElementById('modal-trigger');

                if (!btn) {
                    return;
                }

                const manager = new ModalManager({
                    transitionDuration: 200
                });

                btn.addEventListener('click', () => {

                    let transformer = new Transformer();

                    manager.addModal({
                        header: {
                            enabled: true,
                            title: 'List of Users'
                        },
                        footer: {
                            enabled: false,
                        },
                        body: {
                            cssClass: 'ai-start',
                            inlineStyles: 'font-size: 14px;',
                            contentType: 'ajax',

                            ajaxParams: {
                                url : 'https://jsonplaceholder.typicode.com/users',
                                //url: './users.json',
                                method: 'get',
                                contentDataType: 'json',
                                transformJson: transformer.transform
                            }
                        },
                        maxWidth: {
                            value: 90,
                            unit: 'vw'
                        },

                        maxHeight: {
                            value: 90,
                            unit: 'vh'
                        },
                        onShow : function() {

                            let modalElement = document.getElementById(this.getModalId());

                            bindCompanyInfoClick(modalElement);

                            bindAddressInfoClick(modalElement);
                        }
                    });

                });

                function bindCompanyInfoClick(modal) {

                    if(!modal) {
                        return;
                    }

                    modal.addEventListener('click',(e) => {

                        if(!e.target.classList.contains('company-info')) {
                            return;
                        }

                        manager.addModal({
                            backDrop : {
                                bgColor : 'rgba(255,0,0,0.5)',
                            },
                            header: {
                                enabled: false,
                                title: 'Company Info'
                            },
                            footer: {
                                enabled: false,
                            },
                            body: {
                                cssClass: 'ai-start',
                                contentType: 'template',
                                templateId : e.target.getAttribute('data-template'),
                                transformer : CompanyInfoTransformer.transform
                            },
                            maxWidth: {
                                value: 90,
                                unit: 'vw'
                            },

                            maxHeight: {
                                value: 90,
                                unit: 'vh'
                            }
                        });


                    });

                }

                function bindAddressInfoClick(modal) {

                    if (!modal) {
                        return;
                    }

                    modal.addEventListener('click', (e) => {

                        if (!e.target.classList.contains('address-info')) {
                            return;
                        }

                        manager.addModal({
                            backDrop: {
                                bgColor: 'rgba(0,255,0,0.5)',
                            },
                            header: {
                                enabled: false,
                                title: 'Address Info'
                            },
                            footer: {
                                enabled: false,
                            },
                            body: {
                                cssClass: 'ai-start',
                                contentType: 'image',
                                templateId: e.target.getAttribute('data-template'),
                                transformer: AddressInfoTransformer.transform,
                                ajaxParams:  {
                                    url : 'http://127.0.0.1:9000/demo/php/ajax-json.php',
                                    method: 'post',
                                    data : {
                                        name : 'Anjan'
                                    },
                                    contentDataType: 'json',
                                    transformerJson : '__json_transformer',
                                    header : {
                                        'Custom' : 'ABCD',
                                        'Test' : 1234
                                    }
                                }
                            },
                            maxWidth: {
                                value: 90,
                                unit: 'vw'
                            },

                            maxHeight: {
                                value: 90,
                                unit: 'vh'
                            }
                        });


                    });

                }

            });
        </script>
