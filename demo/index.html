<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Layered Modal Example</title>
        <link href="https://fonts.googleapis.com/css2?family=Roboto+Serif:ital,wght@0,300;0,400;0,700;1,300;1,700&display=swap"
              rel="stylesheet">

        <!-- Font Awesome 6.2.0 -->
        <link rel="stylesheet" id="font-awesome-6.2.0"
              href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">

        <!-- jQuery 2.1.2 -->
        <script id="script-jq-2.1.2-min" src="//code.jquery.com/jquery-2.1.2.min.js"></script>


        <link rel="stylesheet"
              href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"></script>

        <script src="./dist/bundle.dev.min.umd.js"></script>

        <link rel="stylesheet" href="/dist/styles.min.css">



    </head>
    <body>

        <div class="container mt-3">
            <div class="row">
                <div class="column text-center">

                    <button id="ajax-btn" class="btn btn-success">
                        ES6: Load via Ajax
                    </button>

                </div>
            </div>
        </div>



        <script type="module">

            import {ModalManager} from '/dist/bundle.dev.min.esm.js'

            document.addEventListener('DOMContentLoaded', function () {

                let ajaxBtn = document.getElementById('ajax-btn');


                if(ajaxBtn) {

                    ajaxBtn.addEventListener('click',() => {

                        let formData = new FormData();

                        formData.append('dee[]','??');
                        formData.append('dee[]','++');
                        formData.append('dee[]','--');
                        formData.append('dee[]','**');



                        ModalManager.addModal({
                            closeOnOutsideMouseClick : false,
                            secondaryOverlay : true,
                            transitionDuration : 100,
                            position : 'center-center',
                            maxWidth2 : {
                                unit : '%',
                                value : 90
                            },
                            maxHeight2: {
                                unit: '%',
                                value: 90
                            },
                            backDrop : {
                                bgColor : 'rgba(255,0,0,0.20)',
                                opacity : 1
                            },
                            header : {
                                enabled : true,
                                title : 'Account login',
                                cssClass : 'bg-primary text-white',
                                inlineStyles: 'padding: 20px;',
                                content : 'What content',
                            },
                            footer : {
                                enabled : true,
                                mode : 'confirm',
                                onOk : function() {

                                    let positions = ['top-left', 'top-center', 'top-right', 'middle-left', 'middle-center', 'middle-right', 'bottom-left', 'bottom-center', 'bottom-right'];

                                    let randomPos = Math.ceil(Math.random() * 9) - 1;

                                    ModalManager.addModal({
                                        header : {
                                            enabled : false
                                        },
                                        footer: {
                                            enabled: false
                                        },
                                        body : {
                                            contentType: 'html',
                                            content: `What is this content? Where did it come from?`
                                        },
                                        position : positions[randomPos],
                                    });

                                },
                                inlineStyles: 'padding: 20px;',
                                cssClass : 'bg-warning',
                                okButton : {
                                    text : 'Whats ok?',
                                    iconClass : 'fa fa-fw fa-cogs',
                                    cssClass: 'big-border rounded',
                                    /*iconPosition : 'right',
                                    inlineStyles : 'padding: 30px;font-size: 30px;',
                                    cssClass : 'text-danger'*/
                                },
                                closeButton: {
                                    text: 'Now close!',
                                    iconClass: 'fa fa-fw fa-chevron-right',
                                    cssClass : 'big-border rounded',
                                    /*iconPosition: 'left',
                                    inlineStyles: 'padding: 30px;font-size: 30px;margin-left: 50px;',
                                    cssClass: 'text-success'*/
                                }
                            },

                            xButton : {
                                content : 'Close',
                                iconClass : 'fa fa-cogs',
                                iconPosition : 'right',
                                inlineStyles : 'width: auto !important;border-radius: 4px;padding: 8px 16px;'
                            },
                            body : {
                                inlineStyles : 'padding: 20px;',
                                cssClass : 'bg-info',
                                contentType : 'html',
                                content : `<div><p>Nullam veniam, magna! Sit erat dictumst nibh porro, luctus aut leo cumque, quo nibh ut alias repellendus illum. Totam ultricies, exercitationem harum phasellus aspernatur penatibus incididunt congue dolor non esse, risus faucibus ad aliquet aliquid gravida.</p>
</div>`,
                                ajaxParams : {
                                    timeoutMs: 25000,
                                    decodeParams : true,
                                    url : 'http://127.0.0.1:9000/demo/php/ajax-json.php',
                                    method : 'get',
                                    headers : {
                                        'Custom-Header' : 'What?'
                                    },
                                    data : formData,
                                    data2 : {
                                        keyword : 'Retro Games',
                                        categories : [1,2,3],
                                        other : {
                                            a : 10,
                                            b : 20,
                                            c : {
                                                d : 'booo!'
                                            }
                                        }
                                    },
                                    contentDataType : 'html',
                                },

                            },
                            shiftDistance : {
                                top: -300,
                                left : -300,
                            }
                            /*maxWidth : {
                                value : 60,
                                unit : 'vw'
                            },
                            minWidth: {
                                value: 500,
                                unit: 'px'
                            },
                            maxHeight: {
                                value: 90,
                                unit: 'vh'
                            },
                            minHeight: {
                                value: 300,
                                unit: 'px'
                            }*/
                        });

                    });

                }

            });
        </script>

        <!--<div class="layered-modal-backdrop">
            <div style="height: 1200px;">Woah!</div>
        </div>-->

    </body>
</html>
