<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Layered Modal Example</title>
        <link href="https://fonts.googleapis.com/css2?family=Roboto+Serif:ital,wght@0,300;0,400;0,700;1,300;1,700&display=swap"
              rel="stylesheet">

        <!-- Font Awesome 6.2.0 -->
        <link rel="stylesheet" id="font-awesome-6.2.0"
              href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">

        <!-- jQuery 2.1.2 -->
        <script id="script-jq-2.1.2-min" src="//code.jquery.com/jquery-2.1.2.min.js"></script>


        <link rel="stylesheet"
              href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"></script>

        <link rel="stylesheet" href="/dist/styles.min.css">

        <style>
            .big-border {
                border: solid 10px #333 !important;
            }

            .rounded {
                border-radius: 20px !important;
            }
        </style>

    </head>
    <body style="height: 1200px;">

        <div class="container mt-3">
            <div class="row">
                <div class="column text-center">

                    <button id="ajax-btn" class="btn btn-success">
                        Load via Ajax
                    </button>

                </div>
            </div>
        </div>

        <script>
            class JsonTransformer {
                static transform(data) {
                    return `Transformed Data: ${JSON.stringify(data)}`;
                }
            }
        </script>

        <script type="module">

            import {ModalManager} from '/dist/bundle.min.esm.js'

            const manager = new ModalManager({
                cssClass : {
                    modal : 'my-modal',
                    modalOk : 'what-ok',
                    modalClose : 'no-ok'
                }
            });

            document.addEventListener('DOMContentLoaded', function () {

                let ajaxBtn = document.getElementById('ajax-btn');

                if(ajaxBtn) {

                    ajaxBtn.addEventListener('click',() => {

                        let formData = new FormData();

                        formData.append('dee[]','??');
                        formData.append('dee[]','++');
                        formData.append('dee[]','--');
                        formData.append('dee[]','**');



                        manager.addModal({
                            transitionDuration : 200,
                            draggable : true,
                            overlay : {
                                bgColor : 'rgba(255,0,0,0.20)',
                                opacity : 1
                            },
                            header : {
                                enabled : true,
                                title : 'Account login',
                                cssClass : 'bg-primary text-white',
                                inlineStyles: 'padding: 20px;',
                            },
                            footer : {
                                enabled : true,
                                mode : 'confirm',
                                onOk : function() {
                                    this.hide();
                                },
                                inlineStyles: 'padding: 20px;',
                                cssClass : 'bg-warning',
                                okButton : {
                                    text : 'Whats ok?',
                                    iconClass : 'fa fa-fw fa-cogs',
                                    /*iconPosition : 'right',
                                    inlineStyles : 'padding: 30px;font-size: 30px;',
                                    cssClass : 'text-danger'*/
                                },
                                closeButton: {
                                    text: 'Now close!',
                                    iconClass: 'fa fa-fw fa-chevron-right',
                                    cssClass : 'big-border rounded'
                                    /*iconPosition: 'left',
                                    inlineStyles: 'padding: 30px;font-size: 30px;margin-left: 50px;',
                                    cssClass: 'text-success'*/
                                }
                            },
                            onShow : function() {

                                console.log('%c%s', 'background-color: green;color: #fff;font-size: 1.2em;padding: 1em;', `Shown ...`);

                                console.log('Latest Modal: ',manager.getLatestModal());

                            },
                            onHide() {
                                console.log('%c%s', 'background-color: red;color: #fff;font-size: 1.2em;padding: 1em;', `Hidden ...`);

                                console.log('Latest Modal: ', manager.getLatestModal());
                            },
                            body : {
                                inlineStyles : 'padding: 20px;',
                                cssClass : 'bg-info',
                                contentType : 'ajax',
                                ajaxParams : {
                                    timeoutMs: 25000,
                                    decodeParams : true,
                                    url : 'http://127.0.0.1:9999/?a=b',
                                    method : 'get',
                                    headers : {
                                        'Custom-Header' : 'What?'
                                    },
                                    data : formData,
                                    data2 : {
                                        keyword : 'Retro Games',
                                        categories : [1,2,3],
                                        other : {
                                            a : 10,
                                            b : 20,
                                            c : {
                                                d : 'booo!'
                                            }
                                        }
                                    },
                                    contentDataType : 'html',
                                    transformJson : JsonTransformer.transform
                                },

                            },
                            maxWidth : {
                                value : 60,
                                unit : 'vw'
                            },
                            minWidth: {
                                value: 500,
                                unit: 'px'
                            },
                            maxHeight: {
                                value: 90,
                                unit: 'vh'
                            },
                            minHeight: {
                                value: 300,
                                unit: 'px'
                            }
                        });

                    });

                }

            });
        </script>

    </body>
</html>
