<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Layered Modal Example</title>
        <link href="https://fonts.googleapis.com/css2?family=Roboto+Serif:ital,wght@0,300;0,400;0,700;1,300;1,700&display=swap"
              rel="stylesheet">

        <!-- Font Awesome 6.2.0 -->
        <link rel="stylesheet" id="font-awesome-6.2.0"
              href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">

        <!-- jQuery 2.1.2 -->
        <script id="script-jq-2.1.2-min" src="//code.jquery.com/jquery-2.1.2.min.js"></script>


        <link rel="stylesheet"
              href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"></script>

        <link rel="stylesheet" href="/dist/styles.min.css">



    </head>
    <body>

        <div class="container mt-3">
            <div class="row">
                <div class="column text-center">

                    <button id="ajax-btn" class="btn btn-success">
                        ES6: Load via Ajax 2
                    </button>

                </div>
            </div>
        </div>

        <script type="module">
            import {ModalManager} from "/dist/bundle.dev.min.esm.js";

            window.ModalManager = ModalManager;
        </script>
        <!--<script src="/dist/bundle.dev.min.umd.js"></script>-->

        <script>
            function globalFunc() {
                console.log(this);

                return 'Global function!';
            }
        </script>

        <script type="module">

            class Person {
                name = '';

                constructor(name) {
                    this.name = name;
                }

                hello() {

                    console.log(this);

                    return `Hello ${this?.name}! Args: ${JSON.stringify(arguments)}!`;
                }

                static hello() {
                    console.log(this);

                    return 'Static!';
                }
            }

            document.addEventListener('DOMContentLoaded', function () {

                let ajaxBtn = document.getElementById('ajax-btn');


                if(ajaxBtn) {

                    ajaxBtn.addEventListener('click',() => {

                        let person = new Person('Anjan');


                        ModalManager.addModal({
                            closeOnOutsideMouseClick : false,
                            transitionDuration : 100,
                            position : 'center-center',

                            body : {

                                contentType : 'ajax',
                                ajaxParams : {
                                    url : 'http://127.0.0.1:7000/ajax/ajax-data.php',
                                    data2 : JSON.stringify({a : 10,b : 'Anjan'}),
                                    data : {a: 10, b: 'Anjan',c : [1,2,3]},
                                    method : 'get'
                                }

                            },
                            shiftDistance : {
                                top: -300,
                                left : -300,
                            }

                        });

                    });

                }

            });
        </script>

        <!--<div class="layered-modal-backdrop">
            <div style="height: 1200px;">Woah!</div>
        </div>-->

    </body>
</html>
