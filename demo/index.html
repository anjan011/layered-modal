<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Layered Modal Example</title>
        <link href="https://fonts.googleapis.com/css2?family=Roboto+Serif:ital,wght@0,300;0,400;0,700;1,300;1,700&display=swap"
              rel="stylesheet">

        <!-- Font Awesome 6.2.0 -->
        <link rel="stylesheet" id="font-awesome-6.2.0"
              href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">

        <!-- jQuery 2.1.2 -->
        <script id="script-jq-2.1.2-min" src="//code.jquery.com/jquery-2.1.2.min.js"></script>


        <link rel="stylesheet"
              href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"></script>

        <link rel="stylesheet" href="/dist/styles.min.css">

    </head>
    <body style="height: 1200px;">

        <div class="container mt-3">
            <div class="row">
                <div class="column text-center">

                    <button id="ajax-btn" class="btn btn-success">
                        Load via Ajax
                    </button>

                </div>
            </div>
        </div>

        <script type="module">

            import {ModalManager} from '/dist/bundle.min.esm.js'

            document.addEventListener('DOMContentLoaded', function () {

                let ajaxBtn = document.getElementById('ajax-btn');

                if(ajaxBtn) {

                    ajaxBtn.addEventListener('click',() => {

                        let formData = new FormData();

                        formData.append('dee[]','??');
                        formData.append('dee[]','++');
                        formData.append('dee[]','--');
                        formData.append('dee[]','**');

                        let manager = new ModalManager();

                        manager.addModal({
                            transitionDuration : 200,
                            header : {
                                enabled : true,
                                title : 'Account login',
                                cssClass : 'bg-primary text-white',
                                inlineStyles: 'padding: 20px;',
                            },
                            footer : {
                                enabled : true,
                                mode : 'confirm',
                                onOk : function() {
                                    this.hide();
                                },
                                inlineStyles: 'padding: 20px;',
                                cssClass : 'bg-warning'
                            },
                            onShow : function() {

                                console.log('%c%s', 'background-color: green;color: #fff;font-size: 1.2em;padding: 1em;', `Shown ...`);

                            },
                            onHide() {
                                console.log('%c%s', 'background-color: red;color: #fff;font-size: 1.2em;padding: 1em;', `Hidden ...`);
                            },
                            body : {
                                inlineStyles : 'padding: 20px;',
                                cssClass : 'bg-info',
                                contentType : 'ajax',
                                ajaxParams : {
                                    timeoutMs: 25000,
                                    decodeParams : true,
                                    url : 'http://127.0.0.1:9999/?a=b',
                                    method : 'get',
                                    headers : {
                                        'Custom-Header' : 'What?'
                                    },
                                    data : formData,
                                    data2 : {
                                        keyword : 'Retro Games',
                                        categories : [1,2,3],
                                        other : {
                                            a : 10,
                                            b : 20,
                                            c : {
                                                d : 'booo!'
                                            }
                                        }
                                    },
                                    contentDataType : 'html',
                                    transformJson : function(json) {
                                        return `<div class="mb-3"><strong>Name:</strong> ${json.name} ?? </div> <div class="mb-3"><strong>Code:</strong> ${json.code} ##</div>`;
                                    }
                                },

                            },
                            maxWidth : {
                                value : 60,
                                unit : 'vw'
                            },
                            minWidth: {
                                value: 500,
                                unit: 'px'
                            },
                            maxHeight: {
                                value: 90,
                                unit: 'vh'
                            },
                            minHeight: {
                                value: 300,
                                unit: 'px'
                            }
                        });

                    });

                }

            });
        </script>

    </body>
</html>
