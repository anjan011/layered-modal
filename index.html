<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Layered Modal Example</title>
        <link rel="stylesheet" href="dist/styles.css">
    </head>
    <body>

        <button id="openModal">Open Modal 2</button>
        <button id="closeModal">Close Modal</button>

        <script src="dist/bundle.min.js"></script>

        <script>
            const modalManager = new LayeredModalManager();

            // Add a modal
            document.getElementById('openModal').addEventListener('click', () => {
                modalManager.addModal({
                    header: "<h3>Modal Title</h3>",
                    content: "<p>This is a modal content.</p>",
                    footer: "<button onclick='modalManager.removeModal()'>Close</button>"
                });
            });

            // Remove top modal
            document.getElementById('closeModal').addEventListener('click', () => {
                modalManager.removeModal();
            });
        </script>

    </body>
</html>
