<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Layered Modal Example</title>
        <link href="https://fonts.googleapis.com/css2?family=Roboto+Serif:ital,wght@0,300;0,400;0,700;1,300;1,700&display=swap"
              rel="stylesheet">
        <link rel="stylesheet" href="styles.min.css">
        <script src="minified.bundle.js"></script>
    </head>
    <body>

        <div style="position: fixed;top:0;left:0;right:0;height: 60px;display: flex;justify-content: center;align-items: center;gap: 20px;z-index: 9999999;">
            <button id="openModal" class="modal-open-trigger">Open Modal</button>
            <button id="openVideoModal" class="modal-open-trigger">Open Video</button>
            <button id="closeModal" class="modal-close-trigger">Close Modal</button>
        </div>

        <script>
            function generateRandomPosition() {
                function getRandomInt(min, max) {
                    return Math.floor(Math.random() * (max - min + 1)) + min;
                }

                return {
                    top: getRandomInt(-400, 400),
                    left: getRandomInt(-400, 400),
                    bottom: getRandomInt(-400, 400),
                    right: getRandomInt(-400, 400)
                };
            }

            // Example usage:
            //console.log(generateRandomPosition());

        </script>

        <script>

            /**
             * Generates a guid
             *
             * @returns {string}
             */

            function guid() {
                return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
                    let r = Math.random() * 16 | 0,
                        v = c === 'x' ? r : (r & 0x3 | 0x8);

                    return v.toString(16);
                });
            };


            let modalManager = null;

            document.addEventListener('DOMContentLoaded', function () {



                modalManager = new LayeredModalManager({

                    baseShiftDistance : {
                        top : 100,
                        left: 0,
                    },
                    hideXButton : 0,
                    cssClass: {
                        modalClose: 'damn-modal'
                    },
                    zIndex : 1,
                    transitionDuration: 100,
                });

                let embedCode = `<iframe width="560" height="315" src="https://www.youtube.com/embed/IzQ3gFRj0Bc?si=ezVQJ1aTV2P-NkPE" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>`;

                document.getElementById('openVideoModal').addEventListener('click', () => {
                    modalManager.addModal({
                        userSelect: false,
                        draggable: false,
                        dragHandle: ``,
                        body : {
                            noPadding : true,
                            aspectRatio : 16/9
                        },
                        /*transitionDuration : 100,*/
                        header: {
                            enabled: 0,
                            content: `<h3>The big lie about nuclear waste</h3>`
                        },
                        content: embedCode,
                        footer: {
                            enabled: 0,
                            content: `<div class="d-flex fd-row jc-center gap-3">
<button class='damn-modal lm-btn lm-btn-warning'>Close 33</button>
<button class='damn-modal lm-btn lm-btn-success'>Close 33</button>
<button class='damn-modal lm-btn lm-btn-info'>Close 33</button>
</div>`,
                            mode: 'custom',
                            onOk: function () {
                                console.log('%c%s', 'background-color: green;color: #fff;font-size: 1.2em;padding: 1em;', `Is ok?`);
                                this.hide();
                            }
                        },
                        onShow: function () {

                            /*let pos = generateRandomPosition();

                            this.adjustMargin(pos);*/

                            console.log('Shown');

                            console.log(this.getParams().shiftDistance);

                        },
                        onHide: function () {

                            console.log('Hidden');

                        },

                        width : {
                            value : 800,
                            unit : 'px'
                        }

                    });
                });


                // Add a modal
                document.getElementById('openModal').addEventListener('click', () => {

                    let dragId = guid();

                    modalManager.addModal({
                        userSelect : false,
                        draggable : true,
                        dragHandle : ``,
                        /*transitionDuration : 100,*/
                        header: {
                            enabled : 1,
                            content : `<h3>Modal Title @ ${new Date}</h3>`
                        },
                        content: `<div><p>This is a modal content.<div id='drag-me-${dragId}'>Click and drag!</div> <button class="move-btn">✥</button>
</p></div>`,
                        footer: {
                            enabled : 1,
                            content: `<div class="d-flex fd-row jc-center gap-3">
<button class='damn-modal lm-btn lm-btn-warning'>Close 33</button>
<button class='damn-modal lm-btn lm-btn-success'>Close 33</button>
<button class='damn-modal lm-btn lm-btn-info'>Close 33</button>
</div>`,
                            mode : 'custom',
                            onOk : function() {
                                console.log('%c%s', 'background-color: green;color: #fff;font-size: 1.2em;padding: 1em;', `Is ok?`);
                                this.hide();
                            }
                        },
                        onShow : function() {

                            /*let pos = generateRandomPosition();

                            this.adjustMargin(pos);*/

                            console.log('Shown');

                            console.log(this.getParams().shiftDistance);

                        },
                        onHide : function() {

                            console.log('Hidden');

                        },


                    });
                });

                // Remove top modal
                document.getElementById('closeModal').addEventListener('click', () => {
                    modalManager.removeModal(() => {
                        //console.log('Stack Size: ', modalManager.stackSize());
                    });
                });
            });



        </script>
    </body>
</html>
