<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Layered Modal Example</title>
        <link href="https://fonts.googleapis.com/css2?family=Roboto+Serif:ital,wght@0,300;0,400;0,700;1,300;1,700&display=swap"
              rel="stylesheet">

        <!-- jQuery 2.1.2 -->
        <script id="script-jq-2.1.2-min" src="//code.jquery.com/jquery-2.1.2.min.js"></script>


        <link rel="stylesheet"
              href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"></script>

        <link rel="stylesheet" href="styles.min.css">
        <script src="minified.bundle.js"></script>
        <style>
            .rounded {
                border-radius: 15px !important;

            }
        </style>
    </head>
    <body>

        <div style="position: fixed;top:0;left:0;right:0;height: 60px;display: flex;justify-content: center;align-items: center;gap: 20px;z-index: 9999999;">
            <button id="openModal" class="modal-open-trigger btn btn-primary">Open Modal</button>
            <button id="openVideoModal" class="modal-open-trigger btn btn-info">Open Video</button>
            <button id="closeModal" class="modal-close-trigger btn btn-danger">Close Modal</button>

            <button
                    id="openModalViaData"
                    class="btn btn-warning lm-btn-success"

                    data-layered-modal-trigger="1"

                    data-lm-header-enabled="1"
                    data-lm-header-title="Account login"
                    data-lm-header-title-tag="h5"

                    data-lm-content-type="template"
                    data-lm-content-function="__mc_content"
                    data-lm-content-function-args='{"name":"Justin","age":20}'
                    data-lm-content-html="<div>What the hell Mary! <span class='text-danger'>using html for content ...</span></div>"
                    data-lm-content-template-id="modal-content-1234"

                    data-lm-footer-enabled="0"
                    data-lm-footer-mode="custom"
                    data-lm-footer-template-id="footer-12"

            ><span>Open Using Data Attributes</span></button>
        </div>

        <template id="footer-12">
            <div class="text-center d-flex jc-between ai-center">
                <button type="button" class="btn btn-primary">What?</button>
                <button type="button" class="btn btn-primary">When?</button>
                <button type="button" class="btn btn-primary">Why?</button>
            </div>
        </template>

        <script src="./demo.js" defer></script>

        <template id="modal-content-1234">
            <form>
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" class="form-control" id="username" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" required>
                </div>
                <button type="submit" class="btn btn-primary">Login</button>
            </form>

        </template>
    </body>
</html>
